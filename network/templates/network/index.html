{% extends "network/layout.html" %}
{% load static %}
{% block body %}
    <div class="row justify-content-center">
        <div class="col-lg-8">
            {% if user.is_authenticated %}
                <div id="post-form" class="card mb-4" >
                    <div class="card-body" >
                        <h6 class="card-title mb-3">
                            <i class="bi bi-pencil-square text-primary me-2"></i>
                            What's on your mind?
                        </h6>
                        <textarea class="form-control mb-3" id="post-body" rows="3" placeholder="..."></textarea>
                        <div class="text-end">
                            <button class="btn btn-primary" id='sent_post'>
                                <i class="bi bi-send me-1"></i>Post
                            </button>
                        </div>
                    </div>
                </div>
            {% endif %}
                <div id="main"></div>
                <div id = "pagination" class="mt-4"></div>
        </div>
    </div>
{% endblock %}
{% block script %}
    <script src="{% static 'network/network.js' %}"></script>
{% endblock %}

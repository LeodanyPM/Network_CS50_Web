{% extends "network/layout.html" %}

{% block body %}

    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Register</h2>

                    {% if message %}
                        <div class="alert alert-danger mb-3">{{ message }}</div>
                    {% endif %}

                    <form action="{% url 'register' %}" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input class="form-control" autofocus type="text" name="username" placeholder="Username" required>
                        </div>
                        <div class="mb-3">
                            <input class="form-control" type="email" name="email" placeholder="Email Address" required>
                        </div>
                        <div class="mb-3">
                            <input class="form-control" type="password" name="password" placeholder="Password" required>
                        </div>
                        <div class="mb-3">
                            <input class="form-control" type="password" name="confirmation" placeholder="Confirm Password" required>
                        </div>
                        <div class="d-grid mb-3">
                            <input class="btn btn-primary" type="submit" value="Register">
                        </div>
                    </form>

                    <p class="text-center text-muted mb-0">Already have an account? <a href="{% url 'login' %}">Log In here.</a></p>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
